		<title>Kwantflow</title>
		<script>
			// Polyfill crypto.randomUUID for non-secure contexts (e.g. custom schemes like tauri://)
			if (
				typeof window !== 'undefined' &&
				typeof window.crypto !== 'undefined' &&
				!window.crypto.randomUUID
			) {
				Object.defineProperty(window.crypto, 'randomUUID', {
					value: function () {
						return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
							const r = (Math.random() * 16) | 0;
							const v = c === 'x' ? r : (r & 0x3) | 0x8;
							return v.toString(16);
						});
					},
					writable: true,
					configurable: true,
					enumerable: true
				});
			}

			// Forward uncaught window errors and promise rejections to console.error for Tauri logging
			if (typeof window !== 'undefined') {
				window.addEventListener('error', (event) => {
					console.error(
						'[Uncaught Window Error]:',
						event.message,
						'at',
						event.filename,
						'line',
						event.lineno,
						'col',
						event.colno,
						'error:',
						event.error
					);
				});
				window.addEventListener('unhandledrejection', (event) => {
					console.error('[Unhandled Promise Rejection]:', event.reason);
				});
			}

			// Self-healing observer for stuck body locks (e.g. pointer-events: none / scroll locks left by Bits UI/Radix)
			if (typeof document !== 'undefined') {
				let healingTimeoutId = null;
				const observer = new MutationObserver(() => {
					if (healingTimeoutId) {
						clearTimeout(healingTimeoutId);
					}
					healingTimeoutId = setTimeout(() => {
						healingTimeoutId = null;
						const body = document.body;
						if (!body) return;

						// Check if body is locked
						const isPointerLocked = body.style.pointerEvents === 'none';
						const isScrollLocked =
							body.hasAttribute('data-scroll-locked') || body.style.overflow === 'hidden';

						if (isPointerLocked || isScrollLocked) {
							// Check if any active modals, dropdowns, popovers, select menus, sheets, or alert dialogs are open
							const activeOverlays = document.querySelector(
								'[data-slot="dialog-content"], [data-slot="alert-dialog-content"], [data-slot="sheet-content"], [data-slot="select-content"], [data-slot="dropdown-menu-content"], [data-slot="dropdown-menu-sub-content"], [data-slot="popover-content"], [role="dialog"], [role="menu"], [role="listbox"]'
							);

							// If no active overlays exist, heal the body styles
							if (!activeOverlays) {
								console.debug(
									'[ScrollLockGuard] Stuck body pointer-events/scroll lock detected. Self-healing body...'
								);
								if (isPointerLocked) {
									body.style.pointerEvents = '';
								}
								if (body.hasAttribute('data-scroll-locked')) {
									body.removeAttribute('data-scroll-locked');
								}
								if (body.style.overflow === 'hidden') {
									body.style.overflow = '';
								}
								body.style.paddingRight = '';
								body.style.marginRight = '';

								try {
									window.dispatchEvent(
										new CustomEvent('kwantflow:scroll-lock-healed', {
											detail: { isPointerLocked, isScrollLocked }
										})
									);
								} catch (e) {}
							}
						}
					}, 250);
				});

				// Start observing body mutations once the DOM is loaded
				document.addEventListener('DOMContentLoaded', () => {
					observer.observe(document.body, {
						attributes: true,
						attributeFilter: ['style', 'data-scroll-locked']
					});
				});
			}

			// Immediate theme detection to prevent flash of wrong color
			const isDark =
				localStorage.getItem('theme') === 'dark' ||
				(!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
			if (isDark) {
				document.documentElement.classList.add('dark');
			}
			if (
				typeof window !== 'undefined' &&
				('__TAURI_INTERNALS__' in window || window.__TAURI_INTERNALS__)
			) {
				document.documentElement.classList.add('vibrant-window');
			}
		</script>
