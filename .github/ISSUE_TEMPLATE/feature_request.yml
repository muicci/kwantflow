name: Feature request
description: Suggest an improvement to Kwantflow.
title: '[Feature] '
labels:
  - enhancement
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - RFQs and files
        - Estimating
        - Quotes
        - Setup import
        - Workspaces and backups
        - Email integration
        - Local AI
        - Settings
        - Build or install
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the outcome you want, not the implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Optional. Anything you tried, or how you handle this now.
