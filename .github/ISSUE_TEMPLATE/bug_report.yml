name: Bug report
description: Something in Kwantflow does not work as expected.
title: '[Bug] '
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: Kwantflow version
      description: Shown in Settings > General, or in the installer file name.
      placeholder: 0.13.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Kwantflow is affected?
      options:
        - RFQs and files
        - Estimating
        - Quotes
        - Setup import
        - Workspaces and backups
        - Email integration
        - Local AI
        - Settings
        - Build or install
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong in one or two sentences?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest reliable path to reproduce the issue.
      placeholder: |
        1. Open project ABC
        2. Export the quote PDF
        3. Open Revision History
        4. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostic logs
      description: Optional. Settings > General > Export diagnostic logs saves a local zip. Attach it, or paste the relevant lines. Remove anything confidential first.
